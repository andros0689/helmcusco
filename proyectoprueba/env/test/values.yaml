proyectoprueba:
  replicaCount: 1

  image:
    repository: image-registry.openshift-image-registry.svc:5000
    pullPolicy: IfNotPresent
    namespace: camel-quarkus-sample-test
    tag: "7d1be93abe12d30c0e79b29c4ed7519ba31774aa"

  imagePullSecrets: []
  nameOverride: "proyectoprueba"
  fullnameOverride: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: "proyectopruebaserviceaccount"

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true

  env:
    - name: REST_CONSUMER_APIBASEPATH
      value: "restConsumer"
    - name: REST_CONSUMER_APIPATH
      value: "/api-doc"
    - name: REST_CONSUMER_SERVICEID
      value: "restConsumer"
    - name: REST_CONSUMER_SERVICENAME
      value: "/restConsumer"

  service:
    type: ClusterIP
    port: 80

  httpRoute:
    enabled: true
    termination: edge

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 30m
      memory: 128Mi

  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

  volumes: []

  volumeMounts: []

  nodeSelector: {}

  tolerations: []

  affinity: {}
