apiVersion: v1
kind: Service
metadata:
  name: {{ include "proyectoprueba.fullname" . }}
  labels:
    {{- include "proyectoprueba.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "proyectoprueba.selectorLabels" . | nindent 4 }}
  sessionAffinity: None
  type: ClusterIP