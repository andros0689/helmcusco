  pullPolicy: IfNotPresent
  tag: "86faaa122a32c431bcfe3344d7e0e0b9af611405"

imagePullSecrets: []
nameOverride: "proyectoprueba"
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "proyectopruebaserviceaccount"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true

service:
