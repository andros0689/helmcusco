proyectoprueba:
  replicaCount: 1

  image:
    repository: image-registry.openshift-image-registry.svc:5000
    pullPolicy: IfNotPresent
    namespace: camel-quarkus-sample-dev
    tag: "f60085291b2634d3cb5ac7df1b9cdde4783bc154"

  imagePullSecrets: []
  nameOverride: "proyectoprueba"
  fullnameOverride: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: "proyectopruebaserviceaccount"

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true

  service:
    type: ClusterIP
    port: 80

  httpRoute:
    enabled: true
    termination: edge

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 30m
      memory: 128Mi

  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

  volumes: []

  volumeMounts: []

  nodeSelector: {}

  tolerations: []

  affinity: {}
